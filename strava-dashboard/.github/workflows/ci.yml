name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm test

      - run: npm run build
        env:
          STRAVA_CLIENT_ID: test
          STRAVA_CLIENT_SECRET: test
          SESSION_SECRET: test-secret-must-be-at-least-32-chars-long
